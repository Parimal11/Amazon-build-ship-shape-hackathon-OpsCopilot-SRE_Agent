spring:
  application:
    name: opspilot-backend
  datasource:
    url: jdbc:h2:mem:opspilot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
server:
  port: 8081

opspilot:
  prometheus:
    base-url: http://localhost:9091

